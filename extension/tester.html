<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Test manette Afterglow</title>
  <style>
    :root { color-scheme: light dark; --on: #7b2ff7; --off: #8883; }
    body { font: 15px -apple-system, system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 22px; }
    button#connect { font: inherit; font-weight: 600; padding: 10px 18px; border: 0; border-radius: 999px;
                     color: #fff; background: var(--on); cursor: pointer; }
    #status { margin: 12px 0 24px; }
    .grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .key { min-width: 64px; padding: 8px 10px; border-radius: 8px; text-align: center; background: var(--off); }
    .key.on { background: var(--on); color: #fff; }
    .bars { display: grid; grid-template-columns: 90px 1fr 60px; gap: 6px 10px; align-items: center; }
    .bar { height: 10px; border-radius: 5px; background: var(--off); position: relative; overflow: hidden; }
    .bar > i { position: absolute; top: 0; bottom: 0; background: var(--on); }
    #raw { font: 12px ui-monospace, monospace; word-break: break-all; opacity: .7; }
  </style>
</head>
<body>
  <h1>🎮 Test de la manette Afterglow</h1>
  <p>Cette page vérifie que la manette répond, sans passer par Luna.</p>
  <button id="connect" type="button">Connecter la manette</button>
  <div id="status">Non connectée.</div>
  <div class="grid" id="buttons"></div>
  <div class="bars" id="axes"></div>
  <p>Dernier paquet reçu :</p>
  <div id="raw">—</div>
  <script src="gip-driver.js"></script>
  <script src="tester.js"></script>
</body>
</html>
